name: Check Upstream Updates

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9:00 UTC
  workflow_dispatch:

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for upstream updates
        id: check
        run: |
          UPSTREAM_REPO=$(python3 -c 'import json; print(json.load(open("upstream.lock.json"))["repository"])')
          UPSTREAM_REF=$(python3 -c 'import json; print(json.load(open("upstream.lock.json"))["ref"])')
          CURRENT_COMMIT=$(python3 -c 'import json; print(json.load(open("upstream.lock.json"))["revision"])')
          UPSTREAM_COMMIT=$(git ls-remote "$UPSTREAM_REPO" "refs/heads/$UPSTREAM_REF" | cut -f1)
          UPSTREAM_SHORT="${UPSTREAM_COMMIT:0:7}"

          if [ -z "$UPSTREAM_COMMIT" ]; then
            echo "Could not resolve upstream ref: $UPSTREAM_REF"
            exit 1
          fi

          echo "current=$CURRENT_COMMIT" >> $GITHUB_OUTPUT
          echo "upstream=$UPSTREAM_COMMIT" >> $GITHUB_OUTPUT
          echo "upstream_short=$UPSTREAM_SHORT" >> $GITHUB_OUTPUT
          echo "Locked revision: $CURRENT_COMMIT"
          echo "Upstream HEAD: $UPSTREAM_COMMIT"

          if [ "$CURRENT_COMMIT" = "$UPSTREAM_COMMIT" ]; then
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "Palette snapshot is up to date with upstream"
          else
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "A new upstream revision is available"
          fi

      - name: Ensure upstream-update label
        if: steps.check.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh label list --json name --jq '.[] | select(.name=="upstream-update")' | grep -q .; then
            gh label create "upstream-update" \
              --color "0e8a16" \
              --description "Upstream vendor update"
          fi

      - name: Check for existing issue
        if: steps.check.outputs.needs_update == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --label "upstream-update" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "issue_exists=true" >> $GITHUB_OUTPUT
            echo "issue_number=$EXISTING" >> $GITHUB_OUTPUT
            echo "ℹ️ Issue #$EXISTING already exists"
          else
            echo "issue_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create update issue
        if: steps.check.outputs.needs_update == 'true' && steps.existing.outputs.issue_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Synchronize Modus palettes with upstream (${{ steps.check.outputs.upstream_short }})" \
            --label "upstream-update" \
            --body "## Upstream Update Available

          The [modus-themes](https://github.com/protesilaos/modus-themes) upstream repository has new commits.

          **Upstream HEAD:** \`${{ steps.check.outputs.upstream }}\`

          ### How to Update

          Run the update command:

          \`\`\`sh
          python3 scripts/modus.py sync-upstream
          \`\`\`

          This will:
          1. Fetch upstream into a temporary checkout
          2. Regenerate the CC0 palette snapshot
          3. Update the upstream lock and provenance
          4. Re-render all themes

          After updating, verify the changes:

          \`\`\`sh
          python3 scripts/modus.py validate --tool all
          \`\`\`

          ---
          *This issue was automatically created by the upstream check workflow.*"
