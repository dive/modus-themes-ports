# Modus Operandi Deuteranopia — tmux color theme
# Source this file from your tmux.conf:
#   source-file ~/.config/tmux/themes/modus-operandi-deuteranopia.conf

set -g status-style "bg=#ffffff,fg=#000000"
set -g status-left-style "fg=#595959"
set -g status-right-style "fg=#595959"

set -g window-status-style "fg=#595959,bg=default"
set -g window-status-current-style "fg=#000000,bg=#c4c4c4"

set -g pane-border-style "fg=#9f9f9f"
set -g pane-active-border-style "fg=#0031a9"

set -g message-style "bg=#c4c4c4,fg=#000000"
set -g message-command-style "bg=#e0e0e0,fg=#595959"
set -g popup-style "bg=#ffffff,fg=#000000"

set -g mode-style "bg=#c4c4c4,fg=#000000"
