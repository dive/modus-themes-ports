# Modus Vivendi Deuteranopia — tmux color theme
# Source this file from your tmux.conf:
#   source-file ~/.config/tmux/themes/modus-vivendi-deuteranopia.conf

set -g status-style "bg=#000000,fg=#ffffff"
set -g status-left-style "fg=#989898"
set -g status-right-style "fg=#989898"

set -g window-status-style "fg=#989898,bg=default"
set -g window-status-current-style "fg=#ffffff,bg=#535353"

set -g pane-border-style "fg=#646464"
set -g pane-active-border-style "fg=#2fafff"

set -g message-style "bg=#535353,fg=#ffffff"
set -g message-command-style "bg=#303030,fg=#989898"
set -g popup-style "bg=#000000,fg=#ffffff"

set -g mode-style "bg=#535353,fg=#ffffff"
