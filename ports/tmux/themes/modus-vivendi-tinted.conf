# Palette source: https://protesilaos.com/emacs/modus-themes-colors
# Modus Vivendi Tinted — tmux color theme
# Source this file from your tmux.conf:
#   source-file ~/.config/tmux/themes/modus-vivendi-tinted.conf

set -g status-style "bg=#0d0e1c,fg=#ffffff"
set -g status-left-style "fg=#989898"
set -g status-right-style "fg=#989898"

set -g window-status-style "fg=#989898,bg=default"
set -g window-status-current-style "fg=#ffffff,bg=#4a4f69"

set -g pane-border-style "fg=#61647a"
set -g pane-active-border-style "fg=#2fafff"

set -g message-style "bg=#4a4f69,fg=#ffffff"
set -g message-command-style "bg=#2b3045,fg=#989898"
set -g popup-style "bg=#0d0e1c,fg=#ffffff"

set -g mode-style "bg=#4a4f69,fg=#ffffff"
