# Modus Operandi Tinted — tmux color theme
# Source this file from your tmux.conf:
#   source-file ~/.config/tmux/themes/modus-operandi-tinted.conf

set -g status-style "bg=#fbf7f0,fg=#000000"
set -g status-left-style "fg=#595959"
set -g status-right-style "fg=#595959"

set -g window-status-style "fg=#595959,bg=default"
set -g window-status-current-style "fg=#000000,bg=#c9b9b0"

set -g pane-border-style "fg=#9f9690"
set -g pane-active-border-style "fg=#0031a9"

set -g message-style "bg=#c9b9b0,fg=#000000"
set -g message-command-style "bg=#dfd5cf,fg=#595959"

set -g mode-style "bg=#c9b9b0,fg=#000000"
